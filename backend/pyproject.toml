[project]
name = "ai-judicial-assistant-backend"
version = "0.1.0"
description = "AI Judicial Assistant Platform - Backend API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.6",
    "qdrant-client>=1.7.0",
    "neo4j>=5.14.0",
    "minio>=7.2.0",
    "httpx>=0.26.0",
    "langgraph>=0.2.0",
    "pytesseract>=0.3.10",
    "pdf2image>=1.17.0",
    "python-docx>=1.1.0",
    "pillow>=10.0.0",
    "pydantic[email]>=2.5.0",
    "pytest>=9.0.0",
    "pytest-asyncio>=0.23.0",
    "pypdf>=4.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"

